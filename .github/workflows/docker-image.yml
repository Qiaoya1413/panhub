name: Build and Push Docker Image

# push 到 main 自动构建镜像并发布到 GHCR（ghcr.io/<owner>/<repo>:latest + sha）。
# 产物为两阶段构建的纯静态 nginx 镜像（见 Dockerfile），供 docker pull 部署。
on:
  push:
    branches: [main]
  # 允许手动触发（首次发布 / 紧急重发）
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一时间只跑一个构建任务
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Actions 缓存 Docker 构建层：npm ci / nginx 基础层不重复拉取
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
